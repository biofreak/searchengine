services:
  db:
    image: mysql:8.0.23
    container_name: mysql-db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: 1gjAVnJ
      MYSQL_DATABASE: search_engine
    ports:
      - "3306:3306"
    expose:
      - 3306
    volumes:
      - mysql_data:/var/lib/mysql

volumes:
  mysql_data: